name: License check
description: >
  Lists the licenses of all third-party dependencies (Maven, pnpm, npm, Flutter, pip), writes a report to the
  job summary, compares it with the previous run and opens a GitHub issue when something relevant changed.
author: anotheria solutions
branding:
  icon: shield
  color: blue

inputs:
  working-directory:
    description: Project directory, relative to the repository root.
    default: .
  type:
    description: >
      Project type: auto, maven, pnpm, npm, flutter or pip. auto picks it from pom.xml, pnpm-lock.yaml,
      package-lock.json, pubspec.lock or requirements.txt.
    default: auto
  setup-toolchain:
    description: Install Java / Node+pnpm / Flutter / Python (npm needs nothing). Set to false if an earlier step already did.
    default: "true"
  java-version:
    default: "21"
  java-distribution:
    default: temurin
  maven-settings:
    description: Content of a Maven settings.xml, for private repositories. Pass it from a secret.
    default: ""
  maven-excluded-scopes:
    default: test,provided
  node-version:
    default: "22"
  include-dev:
    description: Also check devDependencies (pnpm, npm).
    default: "false"
  pnpm-include-dev:
    description: Deprecated alias of include-dev.
    default: "false"
  flutter-channel:
    default: stable
  flutter-version:
    description: Exact Flutter version. Empty means latest on flutter-channel.
    default: ""
  python-version:
    default: "3.12"
  requirements-file:
    description: pip requirements file, relative to working-directory.
    default: requirements.txt
  title:
    description: Report title. Defaults to the repository name.
    default: ""
  artifact-name:
    description: >
      Artifact the report is stored in; the next run reads its baseline from it. Must be unique per
      check when the action runs more than once in a workflow.
    default: license-report
  retention-days:
    default: "90"
  notify:
    description: Open or comment on a GitHub issue when relevant changes are found.
    default: "true"
  issue-title:
    default: "License check: changes detected"
  issue-labels:
    description: Comma-separated labels for a new issue. Created if missing.
    default: license-check
  issue-assignees:
    description: Comma-separated GitHub logins to assign a new issue to.
    default: ""
  fail-on-unknown:
    description: Fail the step if any dependency has an unknown or non-open-source license.
    default: "false"
  github-token:
    default: ${{ github.token }}

outputs:
  type:
    value: ${{ steps.detect.outputs.type }}
  changed:
    description: "true if a license changed or a new copyleft/unknown dependency appeared since the last run."
    value: ${{ steps.report.outputs.changed }}
  unknown-count:
    value: ${{ steps.report.outputs.unknown-count }}
  copyleft-count:
    value: ${{ steps.report.outputs.copyleft-count }}
  report:
    description: Path of the Markdown report.
    value: ${{ steps.detect.outputs.dir }}/out/report.md

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPE: ${{ inputs.type }}
        REQUIREMENTS: ${{ inputs.requirements-file }}
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        if [ "$TYPE" = auto ]; then
          if [ -f pom.xml ]; then TYPE=maven
          elif [ -f pnpm-lock.yaml ]; then TYPE=pnpm
          elif [ -f package-lock.json ]; then TYPE=npm
          elif [ -f pubspec.lock ] || [ -f pubspec.yaml ]; then TYPE=flutter
          elif [ -f "$REQUIREMENTS" ]; then TYPE=pip
          else echo "::error title=License check::No pom.xml, pnpm-lock.yaml, package-lock.json, pubspec.lock or $REQUIREMENTS found in '${{ inputs.working-directory }}'"; exit 1
          fi
        fi
        # Separate scratch dir per invocation, so several checks can run in one job.
        dir="$RUNNER_TEMP/license-check/$ARTIFACT"
        rm -rf "$dir" && mkdir -p "$dir"
        echo "type=$TYPE" >> "$GITHUB_OUTPUT"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "Detected project type: $TYPE"

    # --- toolchains -----------------------------------------------------------
    - if: steps.detect.outputs.type == 'maven' && inputs.setup-toolchain == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: maven
        cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

    - if: steps.detect.outputs.type == 'pnpm' && inputs.setup-toolchain == 'true'
      uses: pnpm/action-setup@v6
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - if: steps.detect.outputs.type == 'pnpm' && inputs.setup-toolchain == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - if: steps.detect.outputs.type == 'flutter' && inputs.setup-toolchain == 'true'
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - if: steps.detect.outputs.type == 'pip' && inputs.setup-toolchain == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    # --- collect --------------------------------------------------------------
    - id: collect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPE: ${{ steps.detect.outputs.type }}
        DIR: ${{ steps.detect.outputs.dir }}
        MAVEN_SETTINGS: ${{ inputs.maven-settings }}
        EXCLUDED_SCOPES: ${{ inputs.maven-excluded-scopes }}
        INCLUDE_DEV: ${{ inputs.include-dev == 'true' || inputs.pnpm-include-dev == 'true' }}
        REQUIREMENTS: ${{ inputs.requirements-file }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        case "$TYPE" in
          maven)
            settings=()
            if [ -n "$MAVEN_SETTINGS" ]; then
              printf '%s' "$MAVEN_SETTINGS" > "$DIR/settings.xml"
              settings=(-s "$DIR/settings.xml")
            fi
            mvn "${settings[@]}" -B -ntp org.codehaus.mojo:license-maven-plugin:2.4.0:add-third-party \
              -Dlicense.outputDirectory="$DIR" \
              -Dlicense.thirdPartyFilename=raw.tsv \
              -Dlicense.fileTemplate="$ACTION_PATH/templates/maven-licenses.ftl" \
              -Dlicense.excludedScopes="$EXCLUDED_SCOPES"
            input="$DIR/raw.tsv"
            ;;
          pnpm)
            pnpm install --frozen-lockfile --ignore-scripts
            prod=--prod; [ "$INCLUDE_DEV" = true ] && prod=
            pnpm licenses list $prod --json > "$DIR/raw.json"
            input="$DIR/raw.json"
            ;;
          npm)
            # package-lock.json already records every package's license, so nothing is installed.
            input="$PWD/package-lock.json"
            ;;
          flutter)
            # The lockfile pins SDK packages to the Flutter version that wrote it; if the runner's
            # Flutter differs, fall back to a normal resolve so the check still runs.
            if ! flutter pub get --enforce-lockfile; then
              echo "::warning title=License check::pubspec.lock doesn't match this Flutter SDK; resolved dependencies afresh. Set flutter-version to match the project."
              flutter pub get
            fi
            input="$PWD"
            ;;
          pip)
            python3 -m venv "$DIR/venv"
            "$DIR/venv/bin/pip" install -q --disable-pip-version-check -r "$REQUIREMENTS"
            "$DIR/venv/bin/python" "$ACTION_PATH/scripts/pip_licenses.py" > "$DIR/raw.json"
            input="$DIR/raw.json"
            ;;
          *) echo "::error title=License check::Unsupported type '$TYPE'"; exit 1 ;;
        esac
        echo "input=$input" >> "$GITHUB_OUTPUT"

    # --- baseline from the last successful run ---------------------------------
    - id: baseline
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARTIFACT: ${{ inputs.artifact-name }}
        DIR: ${{ steps.detect.outputs.dir }}
      run: |
        dir="$DIR/baseline"
        mkdir -p "$dir"
        # GITHUB_WORKFLOW_REF = owner/repo/.github/workflows/file.yml@ref
        workflow="$(basename "${GITHUB_WORKFLOW_REF%@*}")"
        ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$GITHUB_REF_NAME" \
          --status success --limit 10 --json databaseId -q '.[].databaseId' 2>/dev/null || true)"
        for id in $ids; do
          if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D "$dir" 2>/dev/null && [ -f "$dir/licenses.tsv" ]; then
            echo "Baseline: run $id"
            echo "file=$dir/licenses.tsv" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "No previous report found; this run becomes the baseline."

    # --- report ---------------------------------------------------------------
    - id: report
      shell: bash
      env:
        TYPE: ${{ steps.detect.outputs.type }}
        DIR: ${{ steps.detect.outputs.dir }}
        INPUT: ${{ steps.collect.outputs.input }}
        BASELINE: ${{ steps.baseline.outputs.file }}
        INCLUDE_DEV: ${{ inputs.include-dev == 'true' || inputs.pnpm-include-dev == 'true' }}
        TITLE: ${{ inputs.title }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        out="$DIR/out"
        dev=(); [ "$INCLUDE_DEV" = true ] && dev=(--include-dev)
        python3 "$ACTION_PATH/scripts/license_report.py" \
          --type "$TYPE" --input "$INPUT" --out-dir "$out" "${dev[@]}" \
          ${BASELINE:+--baseline "$BASELINE"} \
          --title "${TITLE:-${GITHUB_REPOSITORY#*/}} – licenses"
        cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
        if [ -f "$out/changes.md" ]; then
          echo "::warning title=License check::License changes detected, see the job summary."
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.detect.outputs.dir }}/out/licenses.tsv
          ${{ steps.detect.outputs.dir }}/out/report.md
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    # --- notify ---------------------------------------------------------------
    - if: steps.report.outputs.changed == 'true' && inputs.notify == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ inputs.issue-title }}
        LABELS: ${{ inputs.issue-labels }}
        ASSIGNEES: ${{ inputs.issue-assignees }}
        DIR: ${{ steps.detect.outputs.dir }}
      run: |
        body="$DIR/out/changes.md"
        number="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" \
          --json number,title -q "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
        if [ -n "$number" ]; then
          gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body-file "$body"
        else
          args=()
          IFS=',' read -ra labels <<< "$LABELS"
          for l in "${labels[@]}"; do
            l="$(echo "$l" | xargs)"; [ -z "$l" ] && continue
            gh label create "$l" -R "$GITHUB_REPOSITORY" --color D93F0B --force >/dev/null 2>&1 || true
            args+=(--label "$l")
          done
          [ -n "$ASSIGNEES" ] && args+=(--assignee "$ASSIGNEES")
          gh issue create -R "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body" "${args[@]}"
        fi

    - if: inputs.fail-on-unknown == 'true' && steps.report.outputs.unknown-count != '0'
      shell: bash
      run: |
        echo "::error title=License check::${{ steps.report.outputs.unknown-count }} dependencies with unknown or non-open-source licenses."
        exit 1
