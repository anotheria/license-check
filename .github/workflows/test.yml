name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [maven, pnpm, npm, flutter, pip]
    steps:
      - uses: actions/checkout@v6
      - id: check
        uses: ./
        with:
          working-directory: test/${{ matrix.project }}
          artifact-name: license-report-${{ matrix.project }}
          title: fixture ${{ matrix.project }}
          notify: "false"
      - name: Verify
        env:
          TYPE: ${{ steps.check.outputs.type }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          test "$TYPE" = "${{ matrix.project }}"
          test -s "$REPORT"
          head -5 "$REPORT"

  # Two checks in one job must not share state.
  multi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: npm
        uses: ./
        with:
          working-directory: test/npm
          artifact-name: license-report-multi-npm
          notify: "false"
      - id: pip
        uses: ./
        with:
          working-directory: test/pip
          artifact-name: license-report-multi-pip
          notify: "false"
      - name: Verify
        run: |
          test "${{ steps.npm.outputs.type }}" = npm
          test "${{ steps.pip.outputs.type }}" = pip
          grep -q is-number "${{ steps.npm.outputs.report }}"
          ! grep -q is-number "${{ steps.pip.outputs.report }}"
          grep -q requests "${{ steps.pip.outputs.report }}"
